name: PHP security baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.35'
          coverage: none
      - name: Check patched PHP runtime
        run: php scripts/check-php-security.php
      - name: Check PHP syntax
        run: git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l
